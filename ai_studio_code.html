<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>MoodFlix | انتخاب هوشمند فیلم</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AC%3C/text%3E%3C/svg%3E">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap');

  :root{
    --bg-0:#040406;
    --bg-1:#13121b;
    --glass:rgba(255,255,255,0.06);
    --glass-strong:rgba(255,255,255,0.12);
    --border:rgba(255,255,255,0.13);
    --border-strong:rgba(255,255,255,0.22);
    --text:#f5f5f7;
    --text-dim:#9a9aa3;
    --text-faint:#5b5b62;
    --active-color:#0a84ff;
    --active-color-soft:rgba(10,132,255,0.18);
    --radius-lg:28px;
    --radius-md:20px;
    --radius-sm:14px;
  }

  *{box-sizing:border-box;}

  html,body{margin:0;padding:0;}

  body{
    font-family:'Vazirmatn', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif;
    background:var(--bg-0);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }

  .aurora{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }
  .aurora span{
    position:absolute;
    width:46vmax;
    height:46vmax;
    border-radius:50%;
    filter:blur(90px);
    opacity:0.35;
    mix-blend-mode:screen;
    animation:drift 26s ease-in-out infinite alternate;
  }
  .aurora span:nth-child(1){background:#0a84ff;top:-18%;right:-12%;}
  .aurora span:nth-child(2){background:#ff375f;bottom:-20%;left:-14%;animation-duration:32s;animation-delay:-6s;}
  .aurora span:nth-child(3){background:#bf5af2;top:35%;left:30%;width:36vmax;height:36vmax;animation-duration:22s;animation-delay:-12s;}

  @keyframes drift{
    0%{transform:translate(0,0) scale(1);}
    100%{transform:translate(6%,8%) scale(1.15);}
  }

  .page{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:56px 20px 80px;
    min-height:100vh;
  }

  .container{
    width:100%;
    max-width:460px;
    text-align:center;
  }

  .brand{
    font-size:0.78rem;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--text-faint);
    font-weight:600;
    direction:ltr;
    margin-bottom:14px;
  }

  h1{
    font-size:2.1rem;
    font-weight:800;
    margin:0 0 10px 0;
    letter-spacing:-0.5px;
  }

  .subtitle{
    color:var(--text-dim);
    margin:0 0 30px 0;
    font-size:1rem;
    line-height:1.6;
  }

  .mood-box{
    background:var(--glass);
    backdrop-filter:blur(28px) saturate(160%);
    -webkit-backdrop-filter:blur(28px) saturate(160%);
    border:1px solid var(--border);
    border-radius:var(--radius-lg);
    padding:22px;
    box-shadow:0 10px 40px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.06);
  }

  .mood-options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-bottom:20px;
  }

  .mood-btn{
    grid-column:span 1;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    padding:18px 14px;
    color:var(--text);
    font-size:0.95rem;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    transition:transform 0.18s ease, background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    -webkit-tap-highlight-color:transparent;
  }

  .mood-btn .emoji{
    font-size:1.6rem;
    width:46px;
    height:46px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:rgba(255,255,255,0.06);
    transition:background 0.25s ease, transform 0.25s ease;
  }

  .mood-btn:hover{
    background:var(--glass-strong);
    border-color:var(--border-strong);
  }

  .mood-btn:active{
    transform:scale(0.96);
  }

  .mood-btn:focus-visible{
    outline:2px solid var(--mood-color);
    outline-offset:2px;
  }

  .mood-btn.active{
    background:var(--mood-soft);
    border-color:var(--mood-color);
    box-shadow:0 0 0 1px var(--mood-color) inset, 0 8px 24px var(--mood-soft);
  }

  .mood-btn.active .emoji{
    background:var(--mood-color);
    transform:scale(1.08);
  }

  .mood-btn.wide{
    grid-column:1 / -1;
    flex-direction:row;
    justify-content:center;
    gap:12px;
    padding:14px 18px;
  }
  .mood-btn.wide .emoji{
    width:38px;
    height:38px;
    font-size:1.3rem;
  }

  .action-btn{
    width:100%;
    background:linear-gradient(180deg, rgba(255,255,255,0.98), rgba(235,235,240,0.95));
    color:#0b0b0d;
    border:none;
    border-radius:50px;
    padding:16px 20px;
    font-size:1.05rem;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
    transition:transform 0.18s ease, box-shadow 0.3s ease;
    box-shadow:0 6px 24px var(--active-color-soft), 0 4px 14px rgba(0,0,0,0.35);
  }

  .action-btn:hover{transform:translateY(-2px);}
  .action-btn:active{transform:scale(0.97);}

  .hint{
    margin-top:14px;
    font-size:0.85rem;
    color:var(--text-faint);
    min-height:1.2em;
    transition:opacity 0.3s ease;
  }

  .movies-section{
    margin-top:46px;
    width:100%;
    max-width:920px;
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:20px;
  }

  .movie-card{
    background:var(--glass);
    backdrop-filter:blur(20px) saturate(160%);
    -webkit-backdrop-filter:blur(20px) saturate(160%);
    border:1px solid var(--border);
    border-radius:var(--radius-md);
    overflow:hidden;
    text-align:left;
    direction:ltr;
    transition:transform 0.25s ease, border-color 0.25s ease;
    opacity:1; /* اصلاح شد: برای اطمینان از دیده شدن کارت‌ها در صورت عدم اجرای انیمیشن */
    animation:rise 0.5s ease forwards;
  }
  .movie-card:nth-child(1){animation-delay:0.02s;}
  .movie-card:nth-child(2){animation-delay:0.08s;}
  .movie-card:nth-child(3){animation-delay:0.14s;}
  .movie-card:nth-child(4){animation-delay:0.20s;}
  .movie-card:nth-child(5){animation-delay:0.26s;}

  @keyframes rise{
    from{opacity:0; transform:translateY(14px);}
    to{opacity:1; transform:translateY(0);}
  }

  .movie-card:hover{
    transform:translateY(-4px);
    border-color:var(--border-strong);
  }

  .movie-poster{
    width:100%;
    height:340px;
    object-fit:cover;
    display:block;
    background-color:#0e0e13;
  }

  .movie-info{padding:18px;}

  .movie-title{
    margin:0 0 8px 0;
    font-size:1.1rem;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .movie-meta{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    font-size:0.85rem;
    color:var(--text-dim);
  }

  .imdb-rating{
    background:#f5c518;
    color:#000;
    padding:2px 8px;
    border-radius:6px;
    font-weight:700;
    font-size:0.8rem;
  }

  .movie-desc{
    font-size:0.84rem;
    color:var(--text-dim);
    line-height:1.5;
    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
  }

  .skeleton-block{
    background:linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.09) 50%, rgba(255,255,255,0.04) 75%);
    background-size:200% 100%;
    animation:shimmer 1.6s infinite;
    border-radius:10px;
  }
  .skeleton-poster{width:100%;height:340px;border-radius:0;}
  .skeleton-text{height:18px;margin:10px 18px;}
  .skeleton-text.short{width:45%;margin:10px 18px 18px;}

  @keyframes shimmer{
    0%{background-position:200% 0;}
    100%{background-position:-200% 0;}
  }

  .error-card{
    grid-column:1/-1;
    padding:40px;
    text-align:center;
    color:#ff8a8a;
    background:rgba(255,69,58,0.08);
    border:1px solid rgba(255,69,58,0.25);
    border-radius:var(--radius-md);
    direction: rtl;
  }

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
    .movie-card { opacity: 1 !important; }
  }

  @media (max-width:380px){
    .mood-btn.wide{flex-direction:column;}
  }
</style>
</head>
<body>

  <div class="aurora"><span></span><span></span><span></span></div>

  <div class="page">
    <div class="container">
      <div class="brand">MoodFlix</div>
      <h1>امروز چه حسی داری؟</h1>
      <p class="subtitle">حس و حالتو انتخاب کن تا بهترین فیلم‌ها رو برات پیشنهاد بدم</p>

      <div class="mood-box">
        <div class="mood-options" id="mood-options" role="group" aria-label="انتخاب حس و حال">
          <button class="mood-btn" type="button" data-color="#0a84ff" data-movies="Inception,Interstellar,The Matrix" aria-pressed="false">
            <span class="emoji">😴</span> بی‌حالم
          </button>
          <button class="mood-btn" type="button" data-color="#ff9f0a" data-movies="The Hangover,Superbad,Deadpool" aria-pressed="false">
            <span class="emoji">😂</span> می‌خوام بخندم
          </button>
          <button class="mood-btn" type="button" data-color="#ff453a" data-movies="Mad Max: Fury Road,John Wick,Gladiator" aria-pressed="false">
            <span class="emoji">🔥</span> پرانرژی‌ام
          </button>
          <button class="mood-btn" type="button" data-color="#bf5af2" data-movies="Schindler's List,The Green Mile,Forrest Gump" aria-pressed="false">
            <span class="emoji">💔</span> غمگینم
          </button>
          <button class="mood-btn wide" type="button" data-color="#ff375f" data-movies="The Notebook,La La Land,About Time" aria-pressed="false">
            <span class="emoji">❤️</span> رمانتیکم
          </button>
        </div>
        <button class="action-btn" id="show-movies-btn" type="button">نمایش فیلم‌ها</button>
        <p class="hint" id="hint" role="status" aria-live="polite"></p>
      </div>
    </div>

    <div class="movies-section" id="movies-container" aria-live="polite"></div>
  </div>

<script>
  // برای استفاده پایدار، پیشنهاد می‌شود یک کلید اختصاصی و رایگان از سایت OMDb دریافت و جایگزین کنید.
  const API_KEY = '47cb18e4';

  const NO_POSTER_SVG = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450" viewBox="0 0 300 450"><rect width="300" height="450" fill="#0e0e13"/><text x="150" y="225" fill="#5b5b62" text-anchor="middle" dominant-baseline="middle" font-size="20" font-family="Arial, sans-serif">No Poster</text></svg>`
  )}`;

  const buttons = Array.from(document.querySelectorAll('.mood-btn'));
  const moviesContainer = document.getElementById('movies-container');
  const showBtn = document.getElementById('show-movies-btn');
  const hint = document.getElementById('hint');
  const root = document.documentElement;

  let selectedMovies = [];

  function hexToRgba(hex, alpha){
    const h = hex.replace('#','');
    const r = parseInt(h.substring(0,2),16);
    const g = parseInt(h.substring(2,4),16);
    const b = parseInt(h.substring(4,6),16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function applyMoodColor(color){
    root.style.setProperty('--mood-color', color);
    root.style.setProperty('--mood-soft', hexToRgba(color, 0.16));
    root.style.setProperty('--active-color', color);
    root.style.setProperty('--active-color-soft', hexToRgba(color, 0.35));
  }

  function selectMood(btn){
    buttons.forEach(b => { b.classList.remove('active'); b.setAttribute('aria-pressed','false'); });
    btn.classList.add('active');
    btn.setAttribute('aria-pressed','true');
    selectedMovies = btn.getAttribute('data-movies').split(',');
    applyMoodColor(btn.getAttribute('data-color'));
  }

  // انتخاب پیش‌فرض اولیه
  selectMood(buttons[0]);

  buttons.forEach(btn => btn.addEventListener('click', () => selectMood(btn)));

  function escapeHtml(str){
    if (str === undefined || str === null) return '';
    return String(str)
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;')
      .replace(/"/g,'&quot;')
      .replace(/'/g,'&#39;');
  }

  function showSkeletons(count){
    let html = '';
    for (let i = 0; i < count; i++){
      html += `
        <div class="movie-card">
          <div class="skeleton-block skeleton-poster"></div>
          <div class="movie-info" style="padding:0;">
            <div class="skeleton-block skeleton-text" style="width:80%;"></div>
            <div class="skeleton-block skeleton-text short"></div>
            <div class="skeleton-block skeleton-text" style="width:90%;"></div>
          </div>
        </div>
      `;
    }
    moviesContainer.innerHTML = html;
    moviesContainer.scrollIntoView({ behavior:'smooth', block:'start' });
  }

  function showHint(message){
    hint.textContent = message;
    if (message){
      setTimeout(() => { if (hint.textContent === message) hint.textContent = ''; }, 3500);
    }
  }

  showBtn.addEventListener('click', async () => {
    if (selectedMovies.length === 0){
      showHint('یک حس و حال رو انتخاب کن، بعد دوباره بزن 🙂');
      return;
    }

    showHint('');
    showSkeletons(selectedMovies.length);

    const moviePromises = selectedMovies.map(async (movieName) => {
      const cleanName = movieName.trim();
      try {
        const response = await fetch(`https://www.omdbapi.com/?t=${encodeURIComponent(cleanName)}&apikey=${API_KEY}`);
        if (!response.ok) throw new Error('خطای شبکه در اتصال به سرور');
        const data = await response.json();
        return { success: true, movieName: cleanName, data };
      } catch (error) {
        console.error("Fetch Error for:", cleanName, error);
        return { success: false, movieName: cleanName, error: error.message };
      }
    });

    const results = await Promise.all(moviePromises);
    let htmlContent = '';
    let hasSuccessfulLoad = false;

    results.forEach((result) => {
      if (result.success && result.data && result.data.Response === 'True'){
        hasSuccessfulLoad = true;
        const d = result.data;
        const title = escapeHtml(d.Title);
        const year = escapeHtml(d.Year);
        const rating = d.imdbRating && d.imdbRating !== 'N/A' ? escapeHtml(d.imdbRating) : '—';
        const plot = d.Plot && d.Plot !== 'N/A' ? escapeHtml(d.Plot) : 'توضیحی برای این فیلم موجود نیست.';
        const poster = d.Poster && d.Poster !== 'N/A' ? d.Poster : NO_POSTER_SVG;

        htmlContent += `
          <div class="movie-card">
            <img class="movie-poster" src="${poster}" alt="${title}" loading="lazy"
                 onerror="this.onerror=null; this.src='${NO_POSTER_SVG}';">
            <div class="movie-info">
              <h3 class="movie-title">${title}</h3>
              <div class="movie-meta">
                <span>${year}</span>
                <span class="imdb-rating">⭐ ${rating}</span>
              </div>
              <p class="movie-desc">${plot}</p>
            </div>
          </div>
        `;
      } else {
        const name = escapeHtml(result.movieName || 'Unknown');
        let reason = 'اطلاعات فیلم یافت نشد.';
        
        if (result.data && result.data.Error) {
          reason = result.data.Error; // نمایش خطای مستقیم از سمت OMDb مانند منقضی شدن کلید
        } else if (result.error) {
          reason = result.error;
        }

        htmlContent += `
          <div class="movie-card">
            <img class="movie-poster" src="${NO_POSTER_SVG}" alt="Not found">
            <div class="movie-info">
              <h3 class="movie-title" style="color:#ff8a8a;">${name}</h3>
              <p class="movie-desc" style="color:#ff8a8a;">❌ ${reason}</p>
            </div>
          </div>
        `;
      }
    });

    // اگر کل ارتباط با سرور به خاطر مشکل شبکه مسدود شده باشد
    if (!hasSuccessfulLoad && results.every(r => !r.success)) {
      htmlContent = `
        <div class="error-card">
          ⚠️ امکان برقراری ارتباط با سرور فیلم‌ها وجود ندارد.<br>
          <span style="font-size:0.85rem; display:block; margin-top:10px; opacity:0.8;">
            دلایل احتمالی: اختلال در شبکه اینترنت شما، عدم سازگاری کلید API یا نیاز به استفاده از ابزار تغییر آی‌پی (به دلیل محدودیت‌های دسترسی کشور).
          </span>
        </div>`;
    }

    moviesContainer.innerHTML = htmlContent;
    moviesContainer.scrollIntoView({ behavior:'smooth', block:'start' });
  });
</script>
</body>
</html>
