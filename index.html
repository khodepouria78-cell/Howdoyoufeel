<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MoodFlix | انتخاب هوشمند فیلم</title>
    
    <!-- Font Awesome برای آیکون‌ها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --accent-color: #ff3366;
            --accent-hover: #ff1f4b;
            --secondary-bg: #151a2d;
            --card-hover: rgba(255, 255, 255, 0.1);
            --shadow-color: rgba(0, 0, 0, 0.5);
            --rating-color: #f5c518;
            --error-color: #ff7b7b;
            --success-color: #4ade80;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at top, #1a1f38 0%, var(--bg-color) 70%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding-bottom: 50px;
            position: relative;
        }

        /* ذرات پس‌زمینه */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 50%;
            animation: float 20s infinite linear;
        }

        .particle:nth-child(1) { width: 80px; height: 80px; top: 10%; left: 20%; animation-duration: 25s; }
        .particle:nth-child(2) { width: 120px; height: 120px; top: 60%; left: 70%; animation-duration: 30s; }
        .particle:nth-child(3) { width: 60px; height: 60px; top: 30%; left: 80%; animation-duration: 20s; }
        .particle:nth-child(4) { width: 100px; height: 100px; top: 70%; left: 10%; animation-duration: 28s; }
        .particle:nth-child(5) { width: 90px; height: 90px; top: 50%; left: 40%; animation-duration: 22s; }
        .particle:nth-child(6) { width: 70px; height: 70px; top: 20%; left: 60%; animation-duration: 26s; }
        .particle:nth-child(7) { width: 110px; height: 110px; top: 80%; left: 30%; animation-duration: 24s; }
        .particle:nth-child(8) { width: 50px; height: 50px; top: 40%; left: 50%; animation-duration: 18s; }

        @keyframes float {
            0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0.3; }
            25% { transform: translateY(-100px) translateX(50px) rotate(90deg); opacity: 0.6; }
            50% { transform: translateY(-200px) translateX(-30px) rotate(180deg); opacity: 0.3; }
            75% { transform: translateY(-100px) translateX(-80px) rotate(270deg); opacity: 0.6; }
            100% { transform: translateY(0) translateX(0) rotate(360deg); opacity: 0.3; }
        }

        /* هدر اصلی */
        .main-header {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 30px 20px 10px;
            width: 100%;
            max-width: 800px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .logo-icon {
            font-size: 3rem;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .logo-text {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-color), #ff6b9d);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }

        .logo-subtitle {
            font-size: 1rem;
            color: #8a99ad;
            margin-top: 5px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .main-subtitle {
            color: #b0bec5;
            margin: 15px 0 30px;
            font-size: 1.2rem;
            line-height: 1.8;
        }

        .main-subtitle .highlight {
            color: var(--accent-color);
            font-weight: 600;
        }

        /* کانتینر اصلی */
        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 650px;
            text-align: center;
            padding: 0 20px;
        }

        /* استایل شیشه‌ای آیفون */
        .mood-box {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 35px 30px;
            box-shadow: 0 10px 40px var(--shadow-color);
            transition: all 0.4s ease;
        }

        .mood-box:hover {
            box-shadow: 0 15px 50px rgba(255, 51, 102, 0.15);
        }

        .section-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: #c0c8d4;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--accent-color);
            font-size: 1.5rem;
        }

        .mood-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }

        .mood-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 16px 22px;
            color: var(--text-color);
            font-size: 1.1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 15px;
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .mood-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.05), transparent);
            transition: left 0.5s ease;
        }

        .mood-btn:hover::before {
            left: 100%;
        }

        .mood-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: var(--accent-color);
            transform: translateX(-5px);
            box-shadow: 0 5px 20px rgba(255, 51, 102, 0.25);
        }

        .mood-btn.active {
            background: linear-gradient(135deg, var(--accent-color), #ff5e7e);
            border-color: transparent;
            box-shadow: 0 8px 25px rgba(255, 51, 102, 0.4);
            transform: translateX(-8px);
        }

        .mood-btn .emoji {
            font-size: 1.8rem;
            min-width: 40px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .mood-btn:hover .emoji {
            transform: scale(1.2) rotate(10deg);
        }

        .mood-btn.active .emoji {
            transform: scale(1.3);
        }

        .mood-btn .label {
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .mood-btn .arrow {
            margin-left: auto;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.3s ease;
            color: var(--accent-color);
        }

        .mood-btn.active .arrow {
            opacity: 1;
            transform: translateX(0);
            color: white;
        }

        .action-btn {
            background: linear-gradient(135deg, #ffffff, #f0f0f0);
            color: #000000;
            border: none;
            border-radius: 50px;
            padding: 16px 45px;
            font-size: 1.15rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.35s ease;
            box-shadow: 0 6px 20px rgba(255, 255, 255, 0.2);
            letter-spacing: 1px;
            position: relative;
            overflow: hidden;
        }

        .action-btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .action-btn:hover::after {
            width: 300px;
            height: 300px;
        }

        .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.35);
        }

        .action-btn:active {
            transform: translateY(-1px);
        }

        .action-btn .btn-icon {
            margin-left: 8px;
        }

        /* بخش نمایش فیلم‌ها */
        .movies-section {
            position: relative;
            z-index: 1;
            margin-top: 50px;
            width: 90%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px;
        }

        .movie-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            overflow: hidden;
            text-align: left;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .movie-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            border-color: rgba(255, 255, 255, 0.25);
        }

        .movie-poster-wrapper {
            position: relative;
            width: 100%;
            height: 380px;
            overflow: hidden;
            background-color: var(--secondary-bg);
        }

        .movie-poster {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .movie-card:hover .movie-poster {
            transform: scale(1.08);
        }

        .poster-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(11, 15, 25, 0.95), transparent);
            pointer-events: none;
        }

        .movie-info {
            padding: 20px 22px 25px;
            position: relative;
        }

        .movie-title {
            margin: 0 0 12px;
            font-size: 1.3rem;
            font-weight: 700;
            color: #ffffff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.5px;
        }

        .movie-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            font-size: 0.9rem;
            color: #a0b0c0;
        }

        .movie-year {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .imdb-rating {
            background: var(--rating-color);
            color: #000000;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            letter-spacing: 0.5px;
        }

        .movie-desc {
            font-size: 0.9rem;
            color: #b3c2d4;
            line-height: 1.7;
            display: -webkit-box;
            -webkit-line-clamp: 4;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin: 0;
        }        /* اسکلتون لودینگ */
        .skeleton {
            background: linear-gradient(
                90deg,
                rgba(255, 255, 255, 0.03) 25%,
                rgba(255, 255, 255, 0.08) 50%,
                rgba(255, 255, 255, 0.03) 75%
            );
            background-size: 200% 100%;
            animation: shimmer 2s infinite;
            border-radius: 22px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .skeleton-poster {
            width: 100%;
            height: 380px;
            background: linear-gradient(
                180deg,
                var(--secondary-bg) 0%,
                rgba(255, 255, 255, 0.02) 100%
            );
            border-radius: 0;
        }

        .skeleton-text {
            height: 18px;
            margin: 12px 0;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
        }

        .skeleton-text.short {
            width: 55%;
        }

        .skeleton-text.medium {
            width: 75%;
        }

        @keyframes shimmer {
            0% {
                background-position: 200% 0;
            }
            100% {
                background-position: -200% 0;
            }
        }

        /* پیام خطا */
        .error-card {
            grid-column: 1 / -1;
            padding: 50px;
            text-align: center;
            background: rgba(255, 0, 0, 0.08);
            border: 1px solid rgba(255, 0, 0, 0.2);
            border-radius: 22px;
            backdrop-filter: blur(10px);
        }

        .error-card i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--error-color);
        }

        .error-card p {
            color: #ffb3b3;
            font-size: 1.1rem;
            margin: 0;
        }

        .not-found-card {
            background: var(--glass-bg);
            backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 22px;
            overflow: hidden;
            text-align: center;
            padding: 30px;
        }

        .not-found-card .poster-placeholder {
            width: 100%;
            height: 250px;
            background: var(--secondary-bg);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: #3a4055;
            margin-bottom: 20px;
        }

        .not-found-card h3 {
            color: var(--error-color);
            margin-bottom: 10px;
        }

        /* نوتیفیکیشن */
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            padding: 15px 25px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            font-size: 0.95rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transform: translateX(120%);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            border-color: var(--error-color);
            color: var(--error-color);
        }

        .notification.success {
            border-color: var(--success-color);
            color: var(--success-color);
        }

        /* فوتر */
        .footer {
            position: relative;
            z-index: 1;
            text-align: center;
            padding: 30px;
            margin-top: 40px;
            color: #5a6575;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .footer .heart {
            color: var(--accent-color);
            animation: pulse 1.5s infinite;
        }

        /* اسکرول‌بار سفارشی */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* رسپانسیو */
        @media (max-width: 768px) {
            .logo-text {
                font-size: 2rem;
            }

            .mood-box {
                padding: 25px 18px;
                border-radius: 22px;
            }

            .mood-btn {
                padding: 14px 16px;
                font-size: 1rem;
                border-radius: 14px;
            }

            .action-btn {
                padding: 14px 30px;
                font-size: 1rem;
            }

            .movies-section {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 10px;
            }

            .movie-poster-wrapper {
                height: 300px;
            }

            .movie-title {
                font-size: 1.1rem;
            }

            .movie-desc {
                font-size: 0.85rem;
                -webkit-line-clamp: 3;
            }
        }

        @media (max-width: 480px) {
            .logo-text {
                font-size: 1.6rem;
            }

            .logo-icon {
                font-size: 2rem;
            }

            .mood-box {
                padding: 20px 12px;
            }

            .mood-btn {
                padding: 12px 14px;
                font-size: 0.9rem;
            }

            .mood-btn .emoji {
                font-size: 1.4rem;
                min-width: 30px;
            }

            .movie-poster-wrapper {
                height: 250px;
            }
        }
    </style>
</head>
<body>
    <!-- ذرات پس‌زمینه -->
    <div class="particles">
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
        <div class="particle"></div>
    </div>

    <!-- نوتیفیکیشن -->
    <div class="notification" id="notification"></div>

    <!-- هدر -->
    <header class="main-header">
        <div class="logo-container">
            <span class="logo-icon">🎬</span>
            <span class="logo-text">MoodFlix</span>
        </div>
        <p class="logo-subtitle">• Cinema Mood Detector •</p>
        <p class="main-subtitle">
            حالت رو انتخاب کن تا <span class="highlight">هوش مصنوعی</span> 
            بهترین فیلم‌ها رو برات پیدا کنه ✨
        </p>
    </header>

    <!-- کانتینر اصلی -->
    <div class="container">
        <div class="mood-box">
            <div class="section-title">
                <i class="fas fa-smile-wink"></i>
                <span>چه حسی داری امروز؟</span>

            <div class="mood-options">
                <!-- ✅ مشکل اینجا بود: data-movie به data-mood تغییر کرد -->
                <button class="mood-btn" data-mood="bored">
                    <span class="emoji">😴</span>
                    <span class="label">خسته‌ام... یه فیلم سنگین می‌خوام</span>

                <button class="mood-btn" data-mood="funny">

                <button class="mood-btn" data-mood="energetic">

                    <span class="arrow"><i class="fas fa-chevron-left"></i></span>
                </button>
                <button class="mood-btn" data-mood="sad">
                    <span class="emoji">💔</span>
                    <span class="label">غمگینم... یه فیلم عمیق می‌خوام</span>
                    <span class="arrow"><i class="fas fa-chevron-left"></i></span>
                </button>
                <button class="mood-btn" data-mood="romantic">
                    <span class="emoji">❤️</span>
                    <span class="label">حال و هوای عاشقانه دارم</span>
                    <span class="arrow"><i class="fas fa-chevron-left"></i></span>
                </button>
            </div>
            <button class="action-btn" id="show-movies-btn">
                <i class="fas fa-play btn-icon"></i>
                پیدا کن فیلم رو
            </button>
        </div>
    </div>

    <!-- بخش نمایش فیلم‌ها -->
    <div class="movies-section" id="movies-container"></div>

    <!-- فوتر -->
    <footer class="footer">
        <p>ساخته شده با <span class="heart">❤️</span> توسط Pouria | داده‌ها از OMDb API</p>
        <p style="font-size: 0.75rem; margin-top: 5px;">© 2025 MoodFlix. All rights reserved.</p>

        // =============================================
        // 🔑 کلید API (قابل تغییر توسط کاربر)

        const API_KEY = '47cb18e4';

        // =============================================
        // 🗂️ دیتابیس فیلم‌ها بر اساس مود (data-mood)

        const moodMoviesMap = {

                <text x="150" y="200" fill="#8a99ad" text-anchor="middle" dominant-baseline="middle"

        // =============================================
        // 🔧 متغیرهای DOM

        const buttons = document.querySelectorAll('.mood-btn');
        const moviesContainer = document.getElementById('movies-container');
        const showBtn = document.getElementById('show-movies-btn');
        const notification = document.getElementById('notification');

        let currentMood = 'bored'; // مود پیش‌فرض
        let isFetching = false; // جلوگیری از کلیک‌های مکرر

        // =============================================
        // 📢 تابع نمایش نوتیفیکیشن
        // =============================================
        function showNotification(message, type = '') {
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        // =============================================
        // ✅ تنظیم مود پیش‌فرض
        // =============================================
        function setDefaultMood() {
            const firstBtn = buttons[0];
            firstBtn.classList.add('active');
            currentMood = firstBtn.getAttribute('data-mood');
        }
        setDefaultMood();

        // =============================================
        // 🖱️ مدیریت کلیک روی دکمه‌های مود
        // =============================================
        buttons.forEach(btn => {
            btn.addEventListener('click', () => {
                if (isFetching) {
                    showNotification('⏳ صبر کن... فیلم‌ها در حال دریافت هستن', '');
                    return;
                }
                buttons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                // ✅ اینجا data-mood رو می‌خونه
                currentMood = btn.getAttribute('data-mood');
                
                // افکت ویبره کوچک
                btn.style.transform = 'scale(0.95)';
                setTimeout(() => {
                    btn.style.transform = '';
                }, 150);
            });
        });

        // =============================================
        // 💀 نمایش اسکلتون لودینگ
        // =============================================
        function showSkeletons(count) {
            let html = '';
            for (let i = 0; i < count; i++) {
                html += `
                    <div class="movie-card skeleton">
                        <div class="skeleton-poster"></div>
                        <div class="movie-info" style="padding: 20px 22px;">
                            <div class="skeleton-text" style="width: 80%;"></div>
                            <div class="skeleton-text short"></div>
                            <div class="skeleton-text medium"></div>
                        </div>
                    </div>
                `;
            }
            moviesContainer.innerHTML = html;
            // اسکرول نرم
            setTimeout(() => {
                moviesContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
        }

        // =============================================
        // 🎬 دریافت اطلاعات یک فیلم از OMDb API
        // =============================================
        async function fetchMovieData(movieName) {
            try {
                const response = await fetch(
                    `https://www.omdbapi.com/?t=${encodeURIComponent(movieName.trim())}&apikey=${API_KEY}`
                );
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                if (data.Response === "True") {
                    return { success: true, movieName: movieName.trim(), data };
                } else {
                    return { success: false, movieName: movieName.trim(), error: data.Error || 'فیلم پیدا نشد' };
                }
            } catch (error) {
                return { success: false, movieName: movieName.trim(), error: error.message };
            }
        }

        // =============================================
        // 🏗️ ساخت HTML برای یک کارت فیلم
        // =============================================
        function buildMovieCard(result) {
            if (result.success) {
                const d = result.data;
                const posterSrc = (d.Poster && d.Poster !== 'N/A') ? d.Poster : NO_POSTER_SVG;
                return `
                    <div class="movie-card">
                        <div class="movie-poster-wrapper">
                            <img class="movie-poster" 
                                 src="${posterSrc}" 
                                 alt="${d.Title}" 
                                 loading="lazy"
                                 onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\\'movie-poster-wrapper\\' style=\\'display:flex;align-items:center;justify-content:center;background:#151a2d;height:380px;\\'><span style=\\'font-size:4rem;\\'>🎬</span></div>';">
                            <div class="poster-overlay"></div>
                        </div>
                        <div class="movie-info">
                            <h3 class="movie-title" title="${d.Title}">${d.Title}</h3>
                            <div class="movie-meta">
                                <span class="movie-year">
                                    <i class="far fa-calendar-alt"></i> ${d.Year || 'نامشخص'}
                                </span>
                                <span class="imdb-rating">
                                    <i class="fas fa-star"></i> ${d.imdbRating || 'N/A'}
                                </span>
                            </div>
                            <p class="movie-desc">${d.Plot || 'خلاصه‌ای در دسترس نیست.'}</p>
                        </div>
                    </div>
                `;
            } else {
                return `
                    <div class="not-found-card">
                        <div class="poster-placeholder">🔍</div>
                        <h3>${result.movieName}</h3>
                        <p style="color:#ff7b7b;">❌ ${result.error || 'خطا در دریافت اطلاعات'}</p>
                    </div>
                `;
            }
        }

        // =============================================
        // 🚀 رویداد کلیک دکمه اصلی "پیدا کن فیلم رو"
        // =============================================
        showBtn.addEventListener('click', async () => {
            // بررسی وضعیت دریافت
            if (isFetching) {
                showNotification('⏳ لطفاً صبر کن... در حال دریافت فیلم‌ها', '');
                return;
            }

            // بررسی انتخاب مود
            if (!currentMood) {
                showNotification('⚠️ لطفاً اول یک حالت روحی انتخاب کن!', 'error');
                return;
            }

            // گرفتن لیست فیلم‌ها
            const moviesToFetch = moodMoviesMap[currentMood];
            if (!moviesToFetch || moviesToFetch.length === 0) {
                showNotification('⚠️ لیست فیلم‌ها برای این حالت خالی است.', 'error');
                return;
            }

            // قفل کردن دکمه
            isFetching = true;
            showBtn.disabled = true;
            showBtn.style.opacity = '0.6';
            showBtn.style.cursor = 'not-allowed';
            showBtn.innerHTML = '<i class="fas fa-spinner fa-spin btn-icon"></i> در حال جستجو...';

            // نمایش اسکلتون
            showSkeletons(moviesToFetch.length);

            // دریافت هم‌زمان همه فیلم‌ها
            const moviePromises = moviesToFetch.map(movieName => fetchMovieData(movieName));
            const results = await Promise.all(moviePromises);

            // ساخت HTML نهایی
            let htmlContent = '';
            let successCount = 0;

            results.forEach((result) => {
                htmlContent += buildMovieCard(result);
                if (result.success) successCount++;
            });

            // اگر همه درخواست‌ها شکست خورد
            if (successCount === 0) {
                htmlContent = `
                    <div class="error-card">
                        <i class="fas fa-exclamation-triangle"></i>
                        <p>⚠️ خطا در ارتباط با سرور.</p>
                        <p style="font-size:0.9rem; color:#8a99ad;">لطفاً اتصال اینترنت را بررسی کنید یا دوباره تلاش کنید.</p>
                    </div>
                `;
                showNotification('❌ خطا در دریافت فیلم‌ها. دوباره تلاش کن.', 'error');
            } else if (successCount < results.length) {
                showNotification(`✅ ${successCount} فیلم از ${results.length} فیلم پیدا شد.`, 'success');
            } else {
                showNotification('🎉 همه فیلم‌ها با موفقیت دریافت شدن!', 'success');
            }

            // نمایش نتایج
            moviesContainer.innerHTML = htmlContent;

            // اسکرول نرم به نتایج
            setTimeout(() => {
                moviesContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 200);

            // آزاد کردن دکمه
            isFetching = false;
            showBtn.disabled = false;
            showBtn.style.opacity = '1';
            showBtn.style.cursor = 'pointer';
            showBtn.innerHTML = '<i class="fas fa-play btn-icon"></i> پیدا کن فیلم رو';
        });

        // =============================================
        // ⌨️ کیبورد: Enter برای اجرای جستجو
        // =============================================
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !isFetching) {
                const activeElement = document.activeElement;
                // اگر روی یه دکمه مود فوکوس باشه، اول اون رو انتخاب کن
                if (activeElement && activeElement.classList.contains('mood-btn')) {
                    activeElement.click();
                }
                // اجرای دکمه اصلی
                showBtn.click();
            }
        });

        // =============================================
        // 🎨 کنسول گیمینگ
        // =============================================
        console.log(`
        🎬 MoodFlix v2.0
        ┌──────────────────────────────────┐
        │  "حالت رو بگو، فیلمتو بگیر!"     │
        │  Developed by Pouria             │
        │  API: OMDb (Free Tier)           │
        │  Status: ✅ Ready                │
        └──────────────────────────────────┘
        `);
    </script>
</body>
</html>
